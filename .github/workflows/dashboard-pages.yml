name: Dashboard (GitHub Pages)

# Regenerates the static dashboard with live data once a night and publishes
# it to GitHub Pages. Batch-nightly, not on-demand fan-out — CLAUDE.md §7:
# "Free tiers are small... design for a cache-first, batch-nightly access
# pattern." A manual run is also available via workflow_dispatch.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --all-extras --dev
      - name: Build dashboard with live data
        run: |
          mkdir -p _site
          uv run analyze dashboard -o _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
