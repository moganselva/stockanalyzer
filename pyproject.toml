[project]
name = "stock-analyzer"
version = "0.1.0"
description = "Hybrid equity analysis system for global markets on free-tier data"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "yfinance>=1.6.0",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
    "plotly>=5.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
analyze = "stock_analyzer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-socket>=0.7",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "scipy-stubs>=1.17.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_analyzer"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yfinance"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "statsmodels.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
